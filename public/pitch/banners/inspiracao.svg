<svg xmlns="http://www.w3.org/2000/svg" width="750" height="280" viewBox="0 0 750 280" role="img" aria-label="Inspiração em destaque">
  <defs>
    <linearGradient id="ins-field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EFEBFC"/>
      <stop offset="1" stop-color="#B9AEE4"/>
    </linearGradient>
    <radialGradient id="ins-glow" cx=".72" cy=".6" r=".48">
      <stop offset="0" stop-color="#4318FF" stop-opacity=".42"/>
      <stop offset="1" stop-color="#4318FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="750" height="280" fill="url(#ins-field)"/>
  <rect width="750" height="280" fill="url(#ins-glow)"/>

  <!-- Masonry de quatro colunas: a mesma grade da tela de Inspiração -->
  <g fill="#4318FF">
    <rect x="500" y="46" width="48" height="76" rx="9" opacity=".22"/>
    <rect x="500" y="130" width="48" height="104" rx="9" opacity=".16"/>
    <rect x="556" y="46" width="48" height="112" rx="9" opacity=".3"/>
    <rect x="556" y="166" width="48" height="68" rx="9" opacity=".2"/>
    <rect x="612" y="46" width="48" height="64" rx="9" opacity=".18"/>
    <rect x="612" y="118" width="48" height="116" rx="9" opacity=".28"/>
    <rect x="668" y="46" width="48" height="96" rx="9" opacity=".24"/>
    <rect x="668" y="150" width="48" height="84" rx="9" opacity=".14"/>
  </g>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="46" y="86" font-size="15" font-weight="700" fill="#4318FF" letter-spacing="2.4">INSPIRAÇÃO EM DESTAQUE</text>
    <text x="46" y="150" font-size="52" font-weight="800" font-style="italic" fill="#2C04D7" letter-spacing="-1.6">O que já foi criado</text>
    <text x="46" y="188" font-size="19" font-weight="600" fill="#3B2E8C">Remixe qualquer geração e leve o prompt para o Criar.</text>
    <text x="46" y="232" font-size="14" font-weight="700" fill="#4318FF" letter-spacing=".4">Abrir a Inspiração &#8594;</text>
  </g>
</svg>
